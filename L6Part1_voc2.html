<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 6 Part 1 その他 - 単語マッチングゲーム2</title>
  <style>
    :root {
      --primary-color: #4fc3f7;
      --primary-dark: #0288d1;
      --bg-color: #e0f7fa;
      --card-bg: #ffffff;
      --card-selected: #b2ebf2;
      --text-color: #333333;
      --correct-color: #81c784;
      --wrong-color: #e57373;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', MeiRyo, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    h1 {
      color: var(--primary-dark);
      margin-bottom: 5px;
      text-align: center;
      font-size: 1.8rem;
    }

    .sub-title {
      color: #555;
      font-size: 1rem;
      margin-bottom: 20px;
      text-align: center;
      font-weight: bold;
    }

    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      width: 100%;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: var(--primary-dark);
    }

    .btn:active {
      transform: scale(0.98);
    }

    #game-screen {
      display: flex;
      width: 100%;
      max-width: 1000px;
      gap: 20px;
      align-items: flex-start;
    }

    .game-left {
      flex: 1 1 60%;
      width: 100%;
    }

    .game-right {
      flex: 1 1 40%;
      width: 100%;
      position: sticky;
      top: 20px;
    }

    #completed-table-container {
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: block;
      max-height: 75vh;
      overflow-y: auto;
    }

    table.matched-table {
      width: 100%;
      border-collapse: collapse;
    }

    table.matched-table th, table.matched-table td {
      border: 1px solid #b2ebf2;
      padding: 8px 10px;
      text-align: center;
      font-size: 0.9rem;
    }

    table.matched-table th {
      background-color: var(--primary-color);
      color: white;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
      width: 100%;
      justify-items: center;
    }

    .card {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: var(--card-bg);
      border: 3px solid var(--primary-color);
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: all 0.2s ease;
      word-break: break-word;
    }

    .card:hover {
      border-color: var(--primary-dark);
      transform: translateY(-2px);
    }

    .card.selected {
      background-color: var(--card-selected);
      border-color: var(--primary-dark);
      transform: scale(1.03);
    }

    .card.wrong {
      background-color: var(--wrong-color);
      color: white;
      animation: shake 0.3s;
    }

    .card.hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: left;
    }

    .modal-content h2 {
      color: var(--primary-dark);
      margin-bottom: 15px;
      text-align: center;
    }

    .result-item {
      margin-bottom: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .result-item strong {
      color: #555;
    }

    .wrong-words-list {
      background: #ffebee;
      border: 1px solid #ffcdd2;
      border-radius: 8px;
      padding: 10px;
      margin-top: 5px;
      max-height: 120px;
      overflow-y: auto;
      font-size: 0.85rem;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-buttons .btn {
      flex: 1;
      margin-top: 0;
    }

    .btn-secondary {
      background-color: #b0bec5;
    }
    .btn-secondary:hover {
      background-color: #78909c;
    }

    @media (max-width: 700px) {
      #game-screen {
        flex-direction: column-reverse;
      }
      .game-right {
        position: static;
      }
    }
  </style>
</head>
<body>

  <h1>Lesson 6 Part 1 その他</h1>
  <div class="sub-title">日本語と英語をマッチングさせよう</div>

  <!-- ゲーム画面 -->
  <div id="game-screen">
    <div class="game-left">
      <div class="card-grid" id="card-grid"></div>
    </div>
    <div class="game-right">
      <div id="completed-table-container">
        <table class="matched-table">
          <thead>
            <tr>
              <th>英語</th>
              <th>日本語</th>
            </tr>
          </thead>
          <tbody id="matched-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 結果ポップアップ -->
  <div class="modal-overlay" id="result-modal">
    <div class="modal-content">
      <h2>🎉 お疲れ様でした！</h2>
      <div class="result-item"><strong>レッスン番号:</strong> Lesson 6</div>
      <div class="result-item"><strong>Part番号:</strong> Part 1 その他</div>
      <div class="result-item"><strong>組:</strong> <span id="res-class"></span></div>
      <div class="result-item"><strong>番:</strong> <span id="res-number"></span></div>
      <div class="result-item"><strong>氏名:</strong> <span id="res-name"></span></div>
      <div class="result-item"><strong>成功日時:</strong> <span id="res-time"></span></div>
      <div class="result-item" style="margin-top: 10px;">
        <strong>間違った英単語:</strong>
        <div class="wrong-words-list" id="res-wrong-words">なし</div>
      </div>
      <div class="modal-buttons" id="modal-buttons"></div>
    </div>
  </div>

  <script>
    const wordList = [
      { id: 1, en: "parts", jp: "名 地域" },
      { id: 2, en: "celebrate", jp: "動 お祝いする" },
      { id: 3, en: "autumn", jp: "名 秋" },
      { id: 4, en: "selection", jp: "名 品揃え" },
      { id: 5, en: "participate in", jp: "動 参加する" },
      { id: 6, en: "market", jp: "名 市場(しじょう)" },
      { id: 7, en: "offer", jp: "動 提供する" },
      { id: 8, en: "care about", jp: "動 気にかける" },
      { id: 9, en: "meaning", jp: "名 意味" },
      { id: 10, en: "origin", jp: "名 起源" }
    ];

    let currentWordList = [...wordList];
    let userInfo = { class: '', number: '', name: '' };
    let selectedCards = [];
    let matchedCount = 0;
    let wrongWords = new Set();
    let audioCtx = null;

    // 読み込み時に localStorage から取得
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('userInfo');
      if (savedUser) {
        try {
          userInfo = JSON.parse(savedUser);
        } catch(e) {
          console.error("ユーザー情報の読み込みに失敗しました", e);
        }
      }
      restartAll();
    });

    function playSound(type) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(659.25, now);
        osc.frequency.setValueAtTime(880, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.setValueAtTime(130, now + 0.2);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      }
    }

    function initGame(resetTable = true) {
      matchedCount = 0;
      wrongWords.clear();
      selectedCards = [];
      if (resetTable) {
        document.getElementById('matched-tbody').innerHTML = '';
      }
      document.getElementById('result-modal').style.display = 'none';

      let cardsData = [];
      currentWordList.forEach(item => {
        cardsData.push({ id: item.id, text: item.en, type: 'en', pairText: item.jp });
        cardsData.push({ id: item.id, text: item.jp, type: 'jp', pairText: item.en });
      });

      for (let i = cardsData.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cardsData[i], cardsData[j]] = [cardsData[j], cardsData[i]];
      }

      const grid = document.getElementById('card-grid');
      grid.innerHTML = '';
      cardsData.forEach(data => {
        const card = document.createElement('div');
        card.className = 'card';
        card.textContent = data.text;
        card.dataset.id = data.id;
        card.dataset.type = data.type;
        card.dataset.text = data.text;
        card.addEventListener('click', () => handleCardClick(card));
        grid.appendChild(card);
      });
    }

    function handleCardClick(card) {
      if (card.classList.contains('hidden') || card.classList.contains('selected') || selectedCards.length >= 2) {
        return;
      }

      card.classList.add('selected');
      selectedCards.push(card);

      if (selectedCards.length === 2) {
        const [card1, card2] = selectedCards;
        const isMatch = card1.dataset.id === card2.dataset.id && card1.dataset.type !== card2.dataset.type;

        if (isMatch) {
          playSound('correct');
          setTimeout(() => {
            card1.classList.add('hidden');
            card2.classList.add('hidden');
            
            addMatchedRow(card1, card2);
            matchedCount++;
            selectedCards = [];

            if (matchedCount === currentWordList.length) {
              setTimeout(showResultModal, 500);
            }
          }, 300);

        } else {
          playSound('wrong');
          card1.classList.add('wrong');
          card2.classList.add('wrong');

          selectedCards.forEach(c => {
            const item = wordList.find(w => w.id == c.dataset.id);
            if (item) wrongWords.add(item);
          });

          setTimeout(() => {
            card1.classList.remove('selected', 'wrong');
            card2.classList.remove('selected', 'wrong');
            selectedCards = [];
          }, 800);
        }
      }
    }

    function addMatchedRow(card1, card2) {
      const enText = card1.dataset.type === 'en' ? card1.dataset.text : card2.dataset.text;
      const jpText = card1.dataset.type === 'jp' ? card1.dataset.text : card2.dataset.text;

      const tbody = document.getElementById('matched-tbody');
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${enText}</td><td>${jpText}</td>`;
      tbody.appendChild(tr);
    }

    function showResultModal() {
      document.getElementById('res-class').textContent = userInfo.class || '未割り当て';
      document.getElementById('res-number').textContent = userInfo.number || '未割り当て';
      document.getElementById('res-name').textContent = userInfo.name || '未割り当て';

      const now = new Date();
      const timeStr = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
      document.getElementById('res-time').textContent = timeStr;

      const wrongContainer = document.getElementById('res-wrong-words');
      const btnContainer = document.getElementById('modal-buttons');
      btnContainer.innerHTML = '';

      if (wrongWords.size === 0) {
        wrongContainer.textContent = 'なし（全問一発正解！）';
        btnContainer.innerHTML = `
          <button class="btn btn-secondary" onclick="restartAll()">最初からもう一度</button>
          <button class="btn" onclick="nextProgram()">次の問題へ進む</button>
        `;
      } else {
        const wrongListArray = Array.from(wrongWords);
        wrongContainer.textContent = wrongListArray.map(w => w.en).join(', ');
        btnContainer.innerHTML = `
          <button class="btn" onclick="retryWrongOnly()">間違えた単語だけもう1回</button>
        `;
      }

      document.getElementById('result-modal').style.display = 'flex';
    }

    function retryWrongOnly() {
      currentWordList = Array.from(wrongWords);
      initGame(false);
    }

    function restartAll() {
      currentWordList = [...wordList];
      initGame(true);
    }

    function nextProgram() {
      window.location.href = "L6Part1_text.html";
    }
  </script>
</body>
</html>
